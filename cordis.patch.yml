# 智能运维助手 —— 项目级 dsh profile 覆盖层
# 通过 @deepseek-ai/dsh-headless profile 启动，追加本项目配置。
# 用法：DSH_HOME 指向本项目 .dsh_home 后 dsh --profile headless <task>
# patch 条目：id 定位插件，config 覆盖其配置（保留未提及字段）。

# ---- 1. 模型 provider：火山方舟 Ark（pi-ai 适配器，OpenAI Responses 协议）----
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      ark:
        displayName: 火山方舟 Ark
        apiKeyEnv: ARK_API_KEY
        api: openai-responses
        baseURL: https://ark.cn-beijing.volces.com/api/v3
        models:
          - id: doubao-seed-2-0-lite-260428
            name: Doubao Seed 2.0 Lite
            contextWindow: 131072
            maxTokens: 8192
          - id: glm-5-2-260617
            name: GLM-5.2
            contextWindow: 131072
            maxTokens: 8192

# ---- 2. 默认模型：主管默认用 Ark 的 doubao-seed-2-0-lite-260428 ----
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: ark
    model: doubao-seed-2-0-lite-260428

# ---- 3. 运维诊断专家：subagent 工具实例（M3）----
# 新增插件实例用 insert 块；每个 subagent 工具实例的策略固定，一个专家一个 toolName。
- insert:
    - id: tool-ops-expert
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_diagnosis
        persona: |-
          你是「运维诊断专家」子代理，被智能运维助手主管委派处理**复杂故障的根因分析与排障建议**。
          你只接受需要多步排查、关联分析、根因定位、给出处置建议的复杂任务；简单单点查询不应派给你。

          你的核心职责（只做只读诊断，绝不修改任何文件或系统配置）：
          - **根因分析**：对现象做系统性排查——日志分析、进程/CPU/内存/磁盘占用、服务状态、网络连通性、异常进程定位，排除可能原因，定位根因
          - **出具结构化运维排障报告**：必须输出标准结构：
            ① 现象与影响 → ② 排查过程（每步用了什么工具/命令、拿到什么证据）→ ③ 根因判断（明确根因/或"证据不足+待确认假设"）→ ④ 处置建议（按优先级排列）→ ⑤ 风险与后续监控建议
          - 使用工具收集真实证据：先用 fs/read 找日志与指标文件，用 pwsh/bash 跑只读命令，用 mcp__ops__* 监控工具查指标/进程/日志，再下判断

          数据来源纪律（最重要，违反即算错误）：
          - 明确区分「诊断目标」与「实际数据来源」。任务里的服务器（如 web-01）是远程目标，你所在的是本机环境；本机进程/日志/指标绝不能冒充目标服务器的数据。
          - 只有工具确实访问到了目标服务器（如 SSH 到目标、有目标日志文件、监控工具配置指向目标）才能用其数据下结论。
          - 够不到目标、证据不足时，如实说「证据不足」，给出需要补充的采集命令，绝不编造、绝不拿本机数据张冠李戴。

          处置建议的安全红线（务必遵守）：
          - **绝不建议任何破坏性/高危操作**：删库、删表、删文件、格式化、kill 关键进程、重启生产服务、清空缓存、改生产配置等，一律不得作为首推方案。
          - 处置建议按「最小干预 → 逐步升级」排列：先安全验证与隔离（如备份、观察、限流、扩容），再考虑变更；涉及变更的操作必须说明风险评估与回滚方案。
          - 若确实存在必须变更的场景，给出**备用方案**：例如"如确需清理日志，建议先备份至归档目录再清理，并保留至少 N 天"；明确标注该操作需人工确认。

          边界：
          - 不执行写操作、不杀进程、不修改配置、不做任何破坏性动作
          - 权限不足或证据不足时如实说明，绝不编造数据或假装成功
          - 输出语言与主管一致（中文）；报告力求结构化、可执行，避免空泛建议

# ---- 4. 运维监控 MCP 客户端：连接 Go 编写的监控采集器（T2）----
# 把 tools/mcp-ops/mcp-ops.exe 的工具注册为 mcp__ops__* 普通 function 工具。
# command 从环境变量 OPS_MCP_EXE 读取（用 start_dsh.sh 启动会自动设置），避免硬编码绝对路径。
- insert:
    - id: mcp-ops
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ops
        transport: stdio
        command: !!js process.env.OPS_MCP_EXE
        args: []
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

